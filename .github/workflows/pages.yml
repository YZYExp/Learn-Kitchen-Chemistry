name: Publish reading website
on:
  push:
    branches: [main]
    paths: ['book.json', 'chapters/**', 'appendices/**', 'assets/images/**', 'downloads/**', 'site/**', 'scripts/build_site.py', 'scripts/build_book.py', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install only website dependencies
        run: python -m pip install --only-binary=:all: -r site/requirements.txt
      - name: Build and validate homepage, chapters and images
        run: python scripts/build_site.py --base-path "/${GITHUB_REPOSITORY#*/}/"
      - name: Check browser script syntax
        run: node --check site/app.js
      - name: Verify nonempty Pages artifact
        run: test -s build/site/index.html && test -s build/site/chapters/observe/index.html
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
