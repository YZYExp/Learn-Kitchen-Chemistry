name: Export EPUB
on:
  push:
    branches: [main]
    paths: ['book.json', 'chapters/**', 'appendices/**', 'assets/images/**', 'scripts/build_book.py', 'requirements.txt', '.github/workflows/epub.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: epub-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out book source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install EPUB dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Build and validate EPUB
        run: python scripts/build_book.py
      - name: Upload complete reading edition
        uses: actions/upload-artifact@v7
        with:
          name: kitchen-science-epub-${{ github.sha }}
          path: |
            build/Kitchen-Science-Expanded.epub
            build/validation.json
          if-no-files-found: error
          retention-days: 90
